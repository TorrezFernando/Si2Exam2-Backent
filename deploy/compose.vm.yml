name: fashionstore-vm
services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fashionstore
      POSTGRES_USER: fashionstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run configure_vm.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U fashionstore -d fashionstore"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: ..
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://fashionstore:${POSTGRES_PASSWORD}@database:5432/fashionstore
      SECRET_KEY: ${SECRET_KEY:?Run configure_vm.py first}
      BACKEND_CORS_ORIGINS: '["${FRONTEND_ORIGIN:?Set the frontend HTTPS origin}"]'
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      PUBLIC_WEB_URL: ${FRONTEND_ORIGIN}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1:-}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:-}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:-}
      GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-image}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      LIBELULA_TEST_APPKEY: ${LIBELULA_TEST_APPKEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}
      PAYPAL_BOB_PER_USD: ${PAYPAL_BOB_PER_USD:-6.96}
      AUDIT_LOG_KEY: ${AUDIT_LOG_KEY:-bitacora}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    command: [sh, -c, "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads
      - backups:/app/backups
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  https:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the backend HTTPS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.vm:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
  backups:
  caddy_data:
  caddy_config:
